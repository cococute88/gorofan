# Merge AFTER the root compose; requires Compose >= 2.24.4 (!override).
# This baseline is intentionally accessible only through SSH forwarding.
services:
  backend:
    image: gorofan-backend:${GOROFAN_DEPLOY_SHA:?Set exact deployment SHA}
    restart: unless-stopped
    env_file:
      - /etc/gorofan/gorofan.env
    environment:
      APP_ENV: prod
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Production secret required}
      AUTH_ENABLED: "false"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      MEDIA_ROOT: /app/data/media
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes: !override
      - /srv/gorofan/data:/app/data
    ports: !override
      - "127.0.0.1:8000:8000"
    healthcheck:
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: gorofan-frontend:${GOROFAN_DEPLOY_SHA:?Set exact deployment SHA}
    build:
      args:
        NEXT_PUBLIC_API_BASE: /api/v1
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_BUILD_CPUS: "1"
    environment:
      NEXT_PUBLIC_API_BASE: /api/v1
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
